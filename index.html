<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>向忠 · 个人主页</title>
<meta name="description" content="向忠 — 建筑施工图审查与 AI 审图专家。基于成都，服务于全国。">
<style>
  :root {
    --bg: #0f172a;
    --bg2: #1e293b;
    --fg: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --card: rgba(30, 41, 59, 0.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.7;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
  /* Hero */
  .hero { text-align: center; padding: 2.5rem 0 2rem; }
  .avatar {
    width: 110px; height: 110px; border-radius: 50%;
    overflow: hidden; margin: 0 auto 1.2rem;
    border: 3px solid rgba(56,189,248,.5);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: 1px; }
  .title { color: var(--accent); margin-top: .4rem; font-size: 1.05rem; }
  .loc { color: var(--muted); font-size: .9rem; margin-top: .4rem; }
  .tagline { color: var(--muted); margin-top: 1.2rem; max-width: 560px; margin-left: auto; margin-right: auto; }
  /* Sections */
  section { margin-top: 2.6rem; }
  h2 {
    font-size: 1.05rem; color: var(--accent); margin-bottom: 1rem;
    display: flex; align-items: center; gap: .5rem;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: rgba(148,163,184,.25); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
  .card {
    background: var(--card); border: 1px solid rgba(148,163,184,.15);
    border-radius: 12px; padding: 1.1rem 1.2rem; transition: transform .15s;
  }
  .card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,.4); }
  .card b { display: block; margin-bottom: .3rem; color: #f1f5f9; }
  .card span { color: var(--muted); font-size: .88rem; }
  /* About */
  .about { color: var(--fg); background: var(--card); border: 1px solid rgba(148,163,184,.15); border-radius: 12px; padding: 1.2rem 1.4rem; font-size: .95rem; }
  .about p + p { margin-top: .6rem; }
  /* Contact */
  .contact { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; margin-top: 1.4rem; }
  .btn {
    display: inline-block; padding: .6rem 1.4rem; border-radius: 999px;
    background: rgba(56,189,248,.12); border: 1px solid rgba(56,189,248,.4);
    color: var(--accent); text-decoration: none; font-size: .9rem; transition: all .15s;
  }
  .btn:hover { background: rgba(56,189,248,.25); }
  footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 3rem; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="avatar"><img src="avatar.jpg" alt="向忠"></div>
    <h1>向忠</h1>
    <div class="title">AI+建筑设计、咨询、管理</div>
    <div class="loc">📍 中国 · 成都</div>
    <p class="tagline">AI 驱动设计、咨询、管理全流程，专业专注，以智能化手段让项目更高效、更可靠。</p>
  </div>

  <section>
    <h2>专业领域</h2>
    <div class="cards">
      <div class="card"><b>建筑设计</b><span>为客户提供专业、综合的解决方案</span></div>
      <div class="card"><b>项目管理</b><span>计划、进度、成本管控，为客户降本增效</span></div>
      <div class="card"><b>AI 运用</b><span>提供精准、高效的解决之道</span></div>
    </div>
  </section>

  <section>
    <h2>关于我</h2>
    <div class="about">
      <p>多年建筑设计与管理经验，带领团队完成大量住宅、商业、办公、酒店等类型建筑设计。</p>
      <p>近年专注于将 AI 运用于设计、咨询、管理，用技术革新提升行业效率。</p>
    </div>
  </section>

  <section>
    <h2>联系我</h2>
    <div class="contact">
      <a class="btn" href="mailto:matcarexz@gmail.com">📧 电子邮箱</a>
      <a class="btn" href="https://github.com/matcarexz-gif" target="_blank">🐙 GitHub</a>
    </div>
  </section>

  <footer>© 2026 向忠 · Built with GitHub Pages</footer>
</div>
</body>
</html>
